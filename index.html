<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>BTA317 Case Critique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one narrow column for a phone held in one hand. A slim header with the building and six progress
   marks, one judgement per screen, the facts always one tap away, one wide button at the foot. The look
   follows the lecture deck on the wall: white ground, dark green ink, orange for what matters, and the four
   role colours. One light look by choice. */
:root {
  --bg: #f4f7f6;
  --surface: #ffffff;
  --ink: #234642;
  --ink-soft: #5b6d6a;
  --line: #d5dedc;
  --accent: #ff8200;
  --accent-ink: #9a4e00;
  --accent-soft: #fff0de;
  --data: #0072b2;
  --role-eff: #ff8200;
  --role-com: #008c64;
  --role-flex: #7d50a5;
  --role-res: #234642;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.eyebrow {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.bar .which { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.dots { display: flex; gap: 5px; }
.dots span { width: 18px; height: 5px; border-radius: 3px; background: var(--line); }
.dots span.done { background: var(--ink); }
.dots span.now { background: var(--accent); }
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.55rem;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lead { color: var(--ink-soft); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--data);
  outline-offset: 2px;
}
.go {
  background: var(--ink);
  color: var(--surface);
  border: 0;
  border-radius: var(--radius);
  padding: 14px 16px;
  font-weight: 600;
  font-size: 1rem;
  width: 100%;
}
.go[disabled] { background: var(--line); color: var(--ink-soft); cursor: default; }
.go.reveal { background: var(--accent); color: #2b1500; }
.quiet {
  background: none;
  border: 0;
  padding: 8px 4px;
  color: var(--ink-soft);
  text-decoration: underline;
  font-size: 0.9rem;
  align-self: center;
}
/* start */
.pick {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  width: 100%;
}
.pick .letter {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: #2b1500;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.3rem;
  display: grid;
  place-items: center;
}
.pick b { font-family: var(--font-display); font-size: 1.15rem; display: block; }
.pick small { color: var(--ink-soft); font-size: 0.88rem; }
.pick img { flex: none; width: 84px; height: 56px; object-fit: cover; border-radius: 6px; margin-left: auto; }
ol.plan { margin: 0; padding-left: 1.2em; color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; }
/* the real building */
.photo { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.photo img { display: block; width: 100%; height: auto; }
.photo figcaption { font-size: 0.72rem; color: var(--ink-soft); padding: 5px 10px; }
/* sketch with markers */
.sketch {
  position: relative;
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.sketch img { display: block; width: 100%; height: auto; }
.pin {
  position: absolute;
  width: 34px; height: 34px;
  margin: -17px 0 0 -17px;
  border-radius: 50%;
  border: 2px solid #ffffff;
  background: var(--accent);
  color: #2b1500;
  font-weight: 600;
  font-size: 0.9rem;
  display: grid;
  place-items: center;
  padding: 0;
  box-shadow: 0 1px 4px rgba(35, 70, 66, 0.35);
}
.pin.seen { background: var(--ink); color: #ffffff; }
.pin.on { outline: 3px solid var(--data); outline-offset: 1px; }
.fact { min-height: 8.5em; }
.basis { font-size: 0.84rem; color: var(--ink-soft); }
.basis b { font-weight: 600; color: var(--ink); }
.count { font-size: 0.88rem; color: var(--ink-soft); text-align: center; font-variant-numeric: tabular-nums; }
/* the facts, always at hand */
details.facts summary { font-weight: 600; cursor: pointer; }
details.facts ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }
details.facts li b { font-weight: 600; }
/* choices */
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  flex: 1 1 auto;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.92rem;
  font-weight: 500;
  min-height: 42px;
  text-align: center;
}
.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #ffffff; }
.opts.col { flex-direction: column; }
.opts.col .opt { text-align: left; }
.hint { font-size: 0.85rem; color: var(--ink-soft); }
select, textarea {
  font: inherit;
  color: var(--ink);
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: var(--surface);
}
textarea { min-height: 5em; resize: vertical; }
.role { border-left: 5px solid var(--line); }
.role.eff { border-left-color: var(--role-eff); }
.role.com { border-left-color: var(--role-com); }
.role.flex { border-left-color: var(--role-flex); }
.role.res { border-left-color: var(--role-res); }
.label-quote { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; text-wrap: balance; }
.insight {
  background: var(--accent-soft);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.02rem;
  text-wrap: balance;
}
.audit dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 0; font-size: 0.93rem; }
.audit dt { color: var(--ink-soft); }
.audit dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.audit dd span { display: block; font-weight: 400; color: var(--ink-soft); }
#selftest { white-space: pre-wrap; font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) {
  .go, .opt, .pin { transition: background-color 0.12s, border-color 0.12s; }
}
</style>

      who: "The sources: two magazine articles (Bloomberg 2015, Urban Land 2016), a case study by BRE, the organisation behind BREEAM (2022), and the tenant, Deloitte.",
      spots: [
        { at: [4.05, 4.0], t: "The ceilings", x: "About 28 000 sensors sit in the LED ceiling lights. They sense movement, light, temperature and humidity. Cleaning follows the rooms that were used, and quiet parts of the building can be closed.", b: "What was built, as the magazines and the certifier describe it. One source says 30 000 sensors." },
        { at: [5.75, 3.05], t: "The people", x: "An app finds you a desk from your calendar and sets light and temperature to your liking. About 2 500 staff share about 1 000 desks.", b: "What was built, as the magazines and the tenant describe it." },
        { at: [5.25, 0.26], t: "Under the ground", x: "Heat and cold are stored in an aquifer about 130 m down, with a heat pump, and delivered through ceilings with water pipes.", b: "What was built." },
        { at: [8.0, 4.2], t: "The roofs next door", x: "The building has solar panels on its roof and south façade. More panels sit on the roofs of the university nearby. With those, it is called energy neutral, or even positive.", b: "A claim. It counts panels that are not on the building." },
        { at: [8.1, 1.95], t: "The grid", x: "The sources describe no way in which the building answers the electricity grid.", b: "Not in the sources." },
        { at: [6.4, 1.62], t: "The garage", x: "A camera reads number plates and matches them to staff records. Deloitte says managers cannot see personal data from the sensors.", b: "What was built. The statement about personal data is the tenant's own." },
        { at: [3.75, 4.8], t: "The award", x: "BREEAM-NL Outstanding, 98.36 percent, for new construction. The building is said to use 70 percent less electricity than comparable offices. Another source says about half the energy of an average Dutch office.", b: "A rating of the design at completion, and a claim repeated by magazines and the certifier. No metered data is published." }

      reading: {

  // ---------------------------------------------------------------- state
  var KEY = "bta317-case-critique-v3";
  function fresh() {
    return { c: null, step: 0, seen: [], open: -1,
             lad: { step: "", q: "", facts: [] },
             roles: { eff: { v: "", f: "" }, com: { v: "", f: "" }, flex: { v: "", f: "" }, res: { v: "", f: "" } },
             ev: { best: "", least: "", ask: [] },
             verdict: { v: "", f: "" }, why: "", reveal: false, confirm: false };
  }
  var state = fresh();
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && typeof saved === "object" && CASES[saved.c] && saved.lad && saved.roles && saved.ev && saved.verdict) {
      state = Object.assign(fresh(), saved);
    }
  } catch (e) { /* storage is a convenience only */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

  // ---------------------------------------------------------------- helpers
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function name(list, key) {
    for (var i = 0; i < list.length; i += 1) { if (list[i][0] === key) { return list[i][1]; } }
    return "";
  }
  function pct(c, at) {
    var b = c.box;
    return "left:" + ((at[0] - b[0]) / (b[2] - b[0]) * 100).toFixed(2) + "%;top:" +
           ((b[3] - at[1]) / (b[3] - b[1]) * 100).toFixed(2) + "%";
  }
  function factName(c, i) { return i === "" || !c.spots[+i] ? "" : (+i + 1) + ". " + c.spots[+i].t; }
  function toggle(list, v) { var at = list.indexOf(v); if (at >= 0) { list.splice(at, 1); } else { list.push(v); } }

  function opts(act, list, picked, extra, col) {
    var h = '<div class="opts' + (col ? " col" : "") + '">';
    list.forEach(function (o) {
      var on = Array.isArray(picked) ? picked.indexOf(o[0]) >= 0 : picked === o[0];
      h += '<button class="opt" data-a="' + act + '" data-k="' + o[0] + '"' + (extra || "") + ' aria-pressed="' + on + '">' + o[1] + "</button>";
    });
    return h + "</div>";
  }
  function factSelect(c, id, sel, picked, first) {
    var h = '<select id="' + id + '" data-s="' + sel + '"><option value="">' + first + "</option>";
    c.spots.forEach(function (s, i) {
      h += '<option value="' + i + '"' + (String(picked) === String(i) ? " selected" : "") + ">" + (i + 1) + ". " + s.t + "</option>";
    });
    return h + "</select>";
  }
  function drawer(c, open) {
    var h = '<details class="card facts"' + (open ? " open" : "") + "><summary>The facts about " + c.name + "</summary><ol>";
    c.spots.forEach(function (s) {
      h += "<li><b>" + s.t + ".</b> " + s.x + ' <span class="basis"><b>Basis:</b> ' + s.b + "</span></li>";
    });
    return h + "</ol></details>";
  }
  function foot(label, disabled) {
    return '<button class="go" data-a="next"' + (disabled ? " disabled" : "") + ">" + label + "</button>" +
           '<button class="quiet" data-a="back">Back</button>';
  }

  // ---------------------------------------------------------------- views
  var views = [
    function start() {
      var h = "<h1>Smart, or only automated?</h1>" +

        var c = CASES[k];
        h += '<button class="pick" data-a="pick" data-k="' + k + '"><span class="letter">' + c.letter + "</span><span><b>" +
          c.name + "</b><small>" + c.place + "</small></span>" + (c.photo ? '<img src="' + c.photo + '" alt="">' : "") + "</button>";
      });
      h += '</div><div class="card"><h2>What you will do</h2><ol class="plan">';
      STEPS.forEach(function (s) { h += "<li>" + s + "</li>"; });
      return h + "</ol></div>";
    },
    function facts(c) {
      var n = c.spots.length, seen = state.seen.length;
      var h = "<h1>The facts about " + c.name + "</h1>";
      if (c.photo) {
        h += '<figure class="photo"><img src="' + c.photo + '" alt="' + c.name + ' seen from the street"><figcaption>' + c.credit + "</figcaption></figure>";
      }
      h += '<p class="lead">' + (c.photo ? "That is the building as it stands. Below is the building as a system. " : "") +
        "Tap every marker. Each one tells you what the sources say, and on what basis. You will have these facts with you in every step.</p>" +
        '<div class="sketch"><img src="' + c.img + '" alt="Sketch of ' + c.name + ' as a system">';
      c.spots.forEach(function (s, i) {
        h += '<button class="pin' + (state.seen.indexOf(i) >= 0 ? " seen" : "") + (state.open === i ? " on" : "") +
          '" style="' + pct(c, s.at) + '" data-a="spot" data-i="' + i + '" aria-label="Marker ' + (i + 1) + ": " + s.t + '">' + (i + 1) + "</button>";
      });
      h += "</div>";
      if (state.open >= 0) {
        var s = c.spots[state.open];
        h += '<div class="card fact" aria-live="polite"><h2>' + (state.open + 1) + ". " + s.t + "</h2><p>" + s.x +
          '</p><p class="basis"><b>Basis:</b> ' + s.b + "</p></div>";
      } else {
        h += '<div class="card fact" aria-live="polite"><p class="lead">Nothing opened yet. Start with any marker.</p></div>';
      }
      h += '<p class="count">' + seen + " of " + n + " opened</p>" +
        '<div class="card"><p class="basis">' + c.who + "</p></div>" +
        '<button class="go" data-a="next"' + (seen < n ? " disabled" : "") + ">Next: the ladder</button>";
      if (seen < n) { h += '<button class="quiet" data-a="next">Go on without opening all</button>'; }
      return h;
    },
    function ladder(c) {
      var L = state.lad;
      var h = "<h1>Where does it stand on the ladder?</h1>" +
        '<p class="lead">Judge ' + c.name + " as a whole. People will differ. What counts is your reason.</p>" + drawer(c) +
        '<div class="card"><h2>I place it at</h2>' + opts("ladstep", LADDER, L.step) + "</div>" +
        '<div class="card"><h2>The question that stops it from going higher</h2>' + opts("ladq", QUESTIONS, L.q, "", true) + "</div>" +
        '<div class="card"><h2>The facts that carry my answer</h2><p class="hint">Pick one or two.</p><div class="opts">';
      c.spots.forEach(function (s, i) {
        h += '<button class="opt" data-a="ladfact" data-i="' + i + '" aria-pressed="' + (L.facts.indexOf(i) >= 0) + '">' + (i + 1) + ". " + s.t + "</button>";
      });
      h += "</div></div>";
      return h + foot("Next: the roles", !(L.step && L.q && L.facts.length));
    },
    function roles(c) {
      var h = "<h1>Which roles does it serve?</h1>" +
        '<p class="lead">For each role, decide. If you say yes, name the fact that shows it.</p>' + drawer(c);
      var all = true;
      ROLES.forEach(function (r) {
        var R = state.roles[r[0]];
        if (!R.v) { all = false; }
        h += '<div class="card role ' + r[0] + '"><h2>' + r[1] + "</h2>" + opts("role", ROLEOPT, R.v, ' data-r="' + r[0] + '"', true);
        if (R.v === "yes") {
          h += '<label class="hint" for="role-' + r[0] + '">Shown by</label>' + factSelect(c, "role-" + r[0], "role:" + r[0], R.f, "Choose a fact");
        }
        h += "</div>";
      });
      return h + foot("Next: the evidence", !all);
    },
    function evidence(c) {
      var E = state.ev;
      var h = "<h1>How good is the evidence?</h1>" +
        '<p class="lead">Open the facts and read the basis of each one. Then judge what we really know about ' + c.name + ".</p>" + drawer(c, true) +
        '<div class="card"><h2>The strongest kind of evidence here</h2>' + opts("evbest", BEST, E.best) + "</div>" +
        '<div class="card"><h2><label for="least">The fact I trust least</label></h2>' + factSelect(c, "least", "least", E.least, "Choose a fact") + "</div>" +
        '<div class="card"><h2>Before advising an owner, I would ask for</h2><p class="hint">Pick what matters most.</p>' + opts("evask", ASK, E.ask, "", true) + "</div>";
      return h + foot("Next: your verdict", !(E.best && E.least !== "" && E.ask.length));
    },
    function verdict(c) {
      var V = state.verdict;
      var h = "<h1>Your verdict on " + c.name + "</h1>" +
        '<p class="lead">Smart, or only automated? Decide, and be ready to defend it.</p>' + drawer(c) +
        '<div class="card"><h2>My verdict</h2>' + opts("verdict", VERDICTS, V.v, "", true) + "</div>" +
        '<div class="card"><h2><label for="weighs">The fact that weighs most</label></h2>' + factSelect(c, "weighs", "weighs", V.f, "Choose a fact") + "</div>" +
        '<div class="card"><h2><label for="why">My reason, in one sentence</label></h2><textarea id="why" data-t="why" placeholder="I say this because"></textarea></div>';
      return h + foot("Finish: your audit", !V.v);
    },
    function audit(c) {
      var L = state.lad, E = state.ev, V = state.verdict;
      var h = "<h1>Your audit of " + c.name + '</h1><p class="lead">Report from this card when you are asked.</p>' +
        '<div class="card audit"><dl>' +
        "<dt>Ladder</dt><dd>" + (name(LADDER, L.step) || "not placed") +
          "<span>Stopped by: " + (name(QUESTIONS, L.q) || "not chosen") + "</span><span>Carried by: " +
          (L.facts.map(function (i) { return factName(c, i); }).join("; ") || "no fact chosen") + "</span></dd>" +
        "<dt>Roles</dt><dd>";
      ROLES.forEach(function (r) {
        var R = state.roles[r[0]];
        h += "<span>" + r[1] + ": " + (name(ROLEOPT, R.v) || "not judged").toLowerCase() +
          (R.v === "yes" && R.f !== "" ? " (" + factName(c, R.f) + ")" : "") + "</span>";
      });
      h += "</dd><dt>Evidence</dt><dd>" + (name(BEST, E.best) || "not judged") +
          "<span>Trusted least: " + (factName(c, E.least) || "not chosen") + "</span><span>I would ask for: " +
          (E.ask.map(function (k) { return name(ASK, k).toLowerCase(); }).join("; ") || "nothing chosen") + "</span></dd>" +
        "<dt>Verdict</dt><dd>" + (name(VERDICTS, V.v) || "none yet") +
          (V.f !== "" ? "<span>Weighs most: " + factName(c, V.f) + "</span>" : "") +
          (state.why ? "<span>" + esc(state.why) + "</span>" : "") + "</dd>";
      h += "</dl></div>";
      if (state.reveal) {
        var R = c.reading;
        h += '<div class="card audit"><h2>The lecturer\'s reading of ' + c.name + '</h2><p class="hint">One reading, not the answer. Where does yours differ, and who has the better argument?</p><dl>' +
          "<dt>Ladder</dt><dd>" + R.ladder + "</dd><dt>Roles</dt><dd>" + R.roles + "</dd><dt>Evidence</dt><dd>" + R.evidence +
          "</dd><dt>Verdict</dt><dd>" + R.verdict + "</dd>";
        h += "</dl></div>";
      } else {
        h += '<button class="go reveal" data-a="reveal">Show the lecturer\'s reading</button>' +
          '<p class="hint" style="text-align:center">Wait until the reports are over.</p>';
      }
      return h + '<button class="quiet" data-a="back">Back</button>' +
        '<button class="quiet" data-a="restart">' + (state.confirm ? "Tap again to erase your answers" : "Start over") + "</button>";
    }
  ];

  // ---------------------------------------------------------------- render and events
  var app = document.getElementById("app");
  function textTarget(key) {
    if (key === "why") { return { get: function () { return state.why; }, set: function (v) { state.why = v; } }; }
    return { get: function () { return ""; }, set: function () {} };
  }
  function render(top) {
    var c = CASES[state.c];
    if (!c) { state.step = 0; }
    app.innerHTML = views[state.step](c);
    document.getElementById("which").textContent = c ? c.letter + "  " + c.name : "Smart, or only automated?";
    var dots = "";
    if (c) {
      STEPS.forEach(function (s, i) { dots += '<span class="' + (i + 1 < state.step ? "done" : i + 1 === state.step ? "now" : "") + '"></span>'; });
    }
    document.getElementById("dots").innerHTML = dots;
    Array.prototype.forEach.call(app.querySelectorAll("textarea[data-t]"), function (t) { t.value = textTarget(t.dataset.t).get(); });
    save();
    if (top) { window.scrollTo(0, 0); }
  }

  app.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.matches && t.matches("textarea[data-t]")) { textTarget(t.dataset.t).set(t.value); save(); }
  });
  app.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches("select[data-s]")) { return; }
    var s = t.dataset.s;
    if (s === "least") { state.ev.least = t.value; }
    else if (s === "weighs") { state.verdict.f = t.value; }
    else if (s.indexOf("role:") === 0) { state.roles[s.split(":")[1]].f = t.value; }
    render(false);
  });
  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-a]");
    if (!b || b.disabled) { return; }
    var d = b.dataset, a = d.a, top = false;
    if (a !== "restart") { state.confirm = false; }
    if (a === "pick") { state = fresh(); state.c = d.k; state.step = 1; top = true; }
    else if (a === "spot") { state.open = +d.i; if (state.seen.indexOf(+d.i) < 0) { state.seen.push(+d.i); } }
    else if (a === "next") { state.step = Math.min(state.step + 1, views.length - 1); top = true; }
    else if (a === "back") { state.step = Math.max(state.step - 1, 1); top = true; }
    else if (a === "ladstep") { state.lad.step = d.k; }
    else if (a === "ladq") { state.lad.q = d.k; }
    else if (a === "ladfact") { toggle(state.lad.facts, +d.i); }
    else if (a === "role") { state.roles[d.r].v = d.k; if (d.k !== "yes") { state.roles[d.r].f = ""; } }
    else if (a === "evbest") { state.ev.best = d.k; }
    else if (a === "evask") { toggle(state.ev.ask, d.k); }
    else if (a === "verdict") { state.verdict.v = d.k; }
    else if (a === "reveal") { state.reveal = true; }
    else if (a === "restart") {
      if (state.confirm) { state = fresh(); top = true; } else { state.confirm = true; }
    }
    render(top);
  });

  // ---------------------------------------------------------------- self-test: open the page with #selftest
  function selftest() {
    var out = [];
    function ok(cond, msg) { if (!cond) { throw new Error(msg); } }
    Object.keys(CASES).forEach(function (k) {
      var c = CASES[k];
      ok(c.spots.length === 7, k + ": seven facts");
      ok(c.spots.every(function (s) { return s.t && s.x && s.b; }), k + ": every fact has a text and a basis");
      ok(c.spots.every(function (s) {
        return s.at[0] > c.box[0] && s.at[0] < c.box[2] && s.at[1] > c.box[1] && s.at[1] < c.box[3];
      }), k + ": markers inside the sketch");
      ok(["ladder", "roles", "evidence", "verdict"].every(function (r) { return c.reading[r]; }), k + ": reading complete");
      state = fresh(); state.c = k;
      state.lad = { step: "smart", q: "tell", facts: [0, 4] };
      state.roles.eff = { v: "yes", f: "2" }; state.roles.com = { v: "maybe", f: "" };
      state.roles.flex = { v: "no", f: "" }; state.roles.res = { v: "no", f: "" };
      state.ev = { best: "designed", least: "3", ask: ["energy", "logs"] };
      state.verdict = { v: "part", f: "4" }; state.why = "a <b>reason</b> & more";
      for (var s = 1; s < views.length; s += 1) { ok(views[s](c).length > 200, k + ": view " + s + " renders"); }
      var card = views[6](c);
      ok(card.indexOf("&lt;b&gt;reason") > 0 && card.indexOf("<b>reason") < 0, k + ": typed text is escaped");
      ok(card.indexOf("lecturer's reading of") < 0, k + ": reading hidden until asked");
      state.reveal = true;
      ok(views[6](c).indexOf(c.reading.verdict) > 0, k + ": reading shown on request");
      out.push(k + " ok");
    });
    ok(views.length === 7 && STEPS.length === 5, "five steps and an audit card");
    ok(factName(CASES.edge, "") === "" && factName(CASES.edge, "4") === "5. The grid", "fact names");
    return "SELFTEST OK\n" + out.join("\n");
  }

  var hash = (location.hash || "").replace("#", "");
  if (hash === "selftest") {
    var pre = document.getElementById("selftest");
    pre.hidden = false;
    try { pre.textContent = selftest(); } catch (e) { pre.textContent = "SELFTEST FAILED: " + e.message; }
    state = fresh();
  } else if (hash === "demo-edge" || hash === "demo-viva") {
    // a filled example, for a look at the later screens
    state = fresh(); state.c = hash.split("-")[1]; state.step = 4;
    state.seen = [0, 1, 2, 3, 4, 5, 6];
  } else if (CASES[hash] && !state.c) {
    state.c = hash; state.step = 1;
  }
  render(false);
})();
</script>
</body></html>
